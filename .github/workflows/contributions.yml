name: Sync GitHub contributions

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Mondays ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "contributions"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the PAT so the data-sync push re-triggers the deploy workflow.
          # The auto GITHUB_TOKEN cannot trigger other workflows.
          token: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch contributions
        env:
          # PAT with read:user scope -> includes private contributions.
          # Falls back to the auto token (public contributions only) until set.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-contributions.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain _data/contributions.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/contributions.json
            git commit -m "chore: sync github contributions"
            git push
          else
            echo "No contribution changes."
          fi
